services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: file:/app/data/dev.db
    volumes:
      - dashboard_data:/app/data

volumes:
  dashboard_data:
